<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SkelIO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 300px;
      min-height: 200px;
      background: #1E1E1E;
      color: #FFFFFF;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .stats {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }
    .stat-label {
      font-size: 12px;
      opacity: 0.7;
    }
    .stat-value {
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>SkelIO</h1>
  <div class="stats">
    <div class="stat-item">
      <span class="stat-label">Layout Shifts Prevented</span>
      <span class="stat-value" id="layoutShifts">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Bandwidth Saved</span>
      <span class="stat-value" id="bandwidth">0 KB</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Resources Blocked</span>
      <span class="stat-value" id="blocked">0</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
