<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SkelIO</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 300px;
      min-height: 200px;
      background: #1E1E1E;
      color: #FFFFFF;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .toggle-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-btn.off {
      background: #4CAF50;
      color: #FFFFFF;
    }
    .toggle-btn.off:hover {
      background: #45A049;
    }
    .toggle-btn.on {
      background: #F44336;
      color: #FFFFFF;
    }
    .toggle-btn.on:hover {
      background: #D32F2F;
    }
    .font-btn {
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #2196F3;
      color: #FFFFFF;
      transition: background 0.2s;
    }
    .font-btn:hover {
      background: #1976D2;
    }
    .font-btn:disabled {
      background: #555;
      cursor: default;
    }
    .stats {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
    }
    .stat-label {
      font-size: 12px;
      opacity: 0.7;
    }
    .stat-value {
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>SkelIO</h1>
  <div class="btn-row">
    <button class="toggle-btn off" id="toggleBtn">Enable on this page</button>
    <button class="font-btn" id="fontBtn" disabled>Load Fonts</button>
  </div>
  <button class="font-btn" id="threeDBtn" style="width: 100%; margin-bottom: 16px; background: #9C27B0;" disabled>Freeze Animations & 3D</button>
  <div class="stats">
    <div class="stat-item">
      <span class="stat-label">Layout Shifts Prevented</span>
      <span class="stat-value" id="layoutShifts">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Bandwidth Saved</span>
      <span class="stat-value" id="bandwidth">0 KB</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Resources Blocked</span>
      <span class="stat-value" id="blocked">0</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
