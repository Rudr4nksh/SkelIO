<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      background: #FAF9F6;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 40px;
    }
    .preview-row {
      display: flex;
      gap: 24px;
      align-items: flex-start;
    }
    .card-box {
      width: 290px;
      height: 235px;
      background: #FFFFFF;
      border-radius: 16px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 6px 24px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }
    .card-visual {
      width: 100%;
      height: 155px;
      background: #EEF5F7;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-caption {
      margin-top: 10px;
      font-weight: 700;
      font-size: 13px;
      color: #1E293B;
      text-align: center;
      line-height: 1.35;
    }
    .phone-box {
      width: 210px;
      height: 330px;
      background: #1E293B;
      border-radius: 30px;
      padding: 12px;
      position: relative;
      overflow: visible;
      box-shadow: 0 16px 36px rgba(0,0,0,0.18);
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      border-radius: 22px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 24px;
      gap: 12px;
    }
    .phone-media {
      width: 85%;
      height: 105px;
      background: #288390;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .phone-btn {
      width: 85%;
      height: 36px;
      background: #B6E5E0;
      border: 1.5px solid rgba(40,131,144,0.35);
      border-radius: 6px;
      font-weight: 800;
      font-size: 11px;
      color: #174E58;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.5px;
    }
    .tapping-hand-wrap {
      position: absolute;
      bottom: 45px;
      right: -8px;
      width: 140px;
      height: 150px;
      pointer-events: none;
      z-index: 10;
    }
    .tapping-hand-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    }
  </style>
</head>
<body>

  <div class="preview-row">
    <!-- Card 1: Frustrated User / Jumping Pages -->
    <div class="card-box">
      <div class="card-visual">
        <img src="assets/frustrated_user_clean.png" alt="Frustrated User">
      </div>
      <div class="card-caption">
        Frustrated User /<br>Jumping Pages
      </div>
    </div>

    <!-- Card 2: Tablet (The one the user liked) -->
    <div class="card-box" style="border-color: #8B5CF6; box-shadow: 0 10px 30px rgba(139,92,246,0.15); transform: translateY(-8px);">
      <div class="card-visual" style="background: #F8FAFC;">
        <svg viewBox="0 0 180 120" width="100%" height="100%" fill="none">
          <rect x="18" y="14" width="144" height="92" rx="10" fill="#334155" stroke="#1E293B" stroke-width="2"/>
          <rect x="24" y="20" width="132" height="80" rx="6" fill="#F8FAFC"/>
          <line x1="24" y1="30" x2="156" y2="30" stroke="#E2E8F0" stroke-width="1"/>
          <circle cx="30" cy="25" r="1.5" fill="#EF4444"/>
          <circle cx="35" cy="25" r="1.5" fill="#F59E0B"/>
          <circle cx="40" cy="25" r="1.5" fill="#10B981"/>
          <rect x="52" y="23" width="70" height="4" rx="2" fill="#E2E8F0"/>
          <rect x="30" y="36" width="22" height="58" rx="3" fill="#E2E8F0"/>
          <circle cx="41" cy="44" r="4" fill="#94A3B8"/>
          <line x1="34" y1="54" x2="48" y2="54" stroke="#CBD5E1" stroke-width="2"/>
          <line x1="34" y1="62" x2="46" y2="62" stroke="#CBD5E1" stroke-width="2"/>
          <rect x="58" y="36" width="34" height="22" rx="4" fill="#E2E8F0"/>
          <circle cx="75" cy="47" r="4.5" fill="#CBD5E1"/>
          <rect x="98" y="36" width="34" height="22" rx="4" fill="#E2E8F0"/>
          <circle cx="115" cy="47" r="4.5" fill="#CBD5E1"/>
          <rect x="58" y="62" width="34" height="22" rx="4" fill="#E2E8F0"/>
          <circle cx="75" cy="73" r="4.5" fill="#CBD5E1"/>
          <rect x="98" y="62" width="34" height="22" rx="4" fill="#E2E8F0"/>
          <circle cx="115" cy="73" r="4.5" fill="#CBD5E1"/>
          <line x1="136" y1="40" x2="150" y2="40" stroke="#CBD5E1" stroke-width="2"/>
          <line x1="136" y1="46" x2="148" y2="46" stroke="#CBD5E1" stroke-width="2"/>
          <line x1="136" y1="66" x2="150" y2="66" stroke="#CBD5E1" stroke-width="2"/>
          <line x1="136" y1="72" x2="146" y2="72" stroke="#CBD5E1" stroke-width="2"/>
        </svg>
      </div>
      <div class="card-caption">
        Clear Skeleton Wire Tablet
      </div>
    </div>

    <!-- Card 3: Calm User / Instant Text Load -->
    <div class="card-box">
      <div class="card-visual">
        <img src="assets/calm_user_clean.png" alt="Calm User">
      </div>
      <div class="card-caption">
        Calm User /<br>Instant Text Load
      </div>
    </div>

    <!-- Phone Mockup with Clean Hand -->
    <div class="phone-box">
      <div class="phone-screen">
        <div class="phone-media">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#FFFFFF"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div style="width:85%;height:6px;background:#E2E8F0;border-radius:3px;"></div>
        <div style="width:60%;height:6px;background:#E2E8F0;border-radius:3px;"></div>
        <div class="phone-btn">CLICK TO LOAD</div>
        
        <!-- Clean Transparent Pointing Hand -->
        <div class="tapping-hand-wrap">
          <img src="assets/hand_clean.png" alt="Tapping Hand">
        </div>

      </div>
    </div>
  </div>

</body>
</html>
